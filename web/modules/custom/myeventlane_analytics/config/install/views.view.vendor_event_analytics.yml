langcode: en
status: true
dependencies:
  module:
    - node
    - views
    - commerce_order
id: vendor_event_analytics
label: 'Vendor Event Analytics'
module: views
description: 'Displays RSVP and ticket totals for the current vendor’s events.'
base_table: node_field_data
core: 11.x
display:
  default:
    display_plugin: default
    id: default
    display_title: Default
    display_options:
      title: 'My Events Analytics'
      query:
        type: views_query
      access:
        type: perm
        options:
          perm: 'access content'
      relationships:
        rsvp_target:
          id: rsvp_target
          table: node__field_rsvp_target
          field: field_rsvp_target_target_id
          relationship: none
          base: node
          base_field: nid
          required: false
          label: 'RSVP Submissions'
        variation_event:
          id: variation_event
          table: commerce_product_variation__field_event
          field: field_event_target_id
          relationship: none
          base: node
          base_field: nid
          required: false
          label: 'Product Variations linked to Event'
        order_items:
          id: order_items
          base: commerce_order_item
          base_field: purchased_entity
          relationship: variation_event
          required: false
          label: 'Order Items'
      fields:
        title:
          id: title
          table: node_field_data
          field: title
          label: 'Event Title'
        rsvp_count:
          id: nid
          table: node_field_data
          field: nid
          relationship: rsvp_target
          plugin_id: aggregation
          aggregate_function: COUNT
          label: 'RSVP Count'
        ticket_sales:
          id: quantity
          table: commerce_order_item
          field: quantity
          relationship: order_items
          plugin_id: aggregation
          aggregate_function: SUM
          label: 'Tickets Sold'
      use_ajax: false
      pager:
        type: none
      style:
        type: default
      row:
        type: fields
