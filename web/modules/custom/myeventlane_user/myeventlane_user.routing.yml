myeventlane_user.my_events:
  path: '/my-events'
  defaults:
    _controller: '\Drupal\myeventlane_user\Controller\MyEventsController::dashboard'
    _title: 'My Events'
  requirements:
    _role: 'authenticated'

myeventlane_user.cancel_rsvp:
  path: '/cancel-rsvp/{rsvp}'
  defaults:
    _controller: '\Drupal\myeventlane_user\Controller\RsvpController::cancelRsvp'
  requirements:
    _permission: 'access content'
    rsvp: '\d+'
    
myeventlane_user.my_profile:
  path: '/my-profile'
  defaults:
    _controller: '\Drupal\myeventlane_user\Controller\MyProfileController::view'
    _title: 'My Profile'
  requirements:
    _role: 'authenticated'

myeventlane_user.calendar_download:
  path: '/calendar-download/{event_id}'
  defaults:
    _controller: '\Drupal\myeventlane_user\Controller\CalendarController::download'
    _title: 'Download Calendar'
  requirements:
    _permission: 'access content'
    event_id: '\d+'

myeventlane_rsvp.cancel:
  path: '/rsvp-cancel/{rsvp_id}'
  defaults:
    _controller: '\Drupal\myeventlane_rsvp\Controller\RSVPCancelController::cancel'
    _title: 'Cancel RSVP'
  requirements:
    _permission: 'access content'
    rsvp_id: '\d+'






