myeventlane_theme.mobile:
  label: "Mobile"
  mediaQuery: "(min-width: 0)"
  weight: 0
  multipliers: [1x, 2x]
  group: myeventlane_theme

myeventlane_theme.tablet:
  label: "Tablet"
  mediaQuery: "(min-width: 768px)"
  weight: 1
  multipliers: [1x, 2x]
  group: myeventlane_theme

myeventlane_theme.desktop:
  label: "Desktop"
  mediaQuery: "(min-width: 1024px)"
  weight: 2
  multipliers: [1x, 2x]
  group: myeventlane_theme

myeventlane_theme.wide:
  label: "Wide"
  mediaQuery: "(min-width: 1200px)"
  weight: 3
  multipliers: [1x, 2x]
  group: myeventlane_theme
