myeventlane.vendor_dashboard:
  path: '/dashboard'
  defaults:
    _entity_view: 'user.default'
    _title: 'My Dashboard'
  requirements:
    _role: 'vendor'
    _user_is_logged_in: 'TRUE'
myeventlane.vendor_guestlist:
  path: '/dashboard/my-guests'
  defaults:
    _title: 'Your Guest List'
    _controller: '\Drupal\myeventlane\Controller\GuestListController::view'
  requirements:
    _role: 'vendor'